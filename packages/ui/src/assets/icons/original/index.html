<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeckBuilder icons (original)</title>
<style>
:root { --bg: #0d0e11; --panel: #121317; --border: #262a32; --text: #eceef2; --text-3: #8b93a1; }
:root[data-theme='light'] { --bg: #f4f6f9; --panel: #fff; --border: #d7dee7; --text: #17212c; --text-3: #64748b; }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 13px/1.45 'Geist', 'Segoe UI', system-ui, sans-serif; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--border); border-radius: 7px; height: 28px; padding: 0 10px; cursor: pointer; }
main { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; }
figure svg { width: 24px; height: 24px; }
figcaption { font: 11px 'Geist Mono', Consolas, monospace; color: var(--text-3); text-align: center; word-break: break-all; }
</style></head>
